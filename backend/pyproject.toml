[project]
name = "findoctor-backend"
version = "0.1.0"
description = "FastAPI backend for FinDoctor."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "bcrypt>=5.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic[email]>=2.10.0",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "colorama>=0.4.6",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
