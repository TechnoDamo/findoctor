name: findoctor

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "app", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findoctor}
      POSTGRES_USER: ${POSTGRES_USER:-findoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findoctor} -d ${POSTGRES_DB:-findoctor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["app", "full"]
    env_file:
      - backend/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-findoctor}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-findoctor}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://host.docker.internal:8201}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ru}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-RUB}
        NEXT_PUBLIC_DEFAULT_TIMEZONE: ${NEXT_PUBLIC_DEFAULT_TIMEZONE:-Europe/Moscow}
    profiles: ["app", "full"]
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ru}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-RUB}
      NEXT_PUBLIC_DEFAULT_TIMEZONE: ${NEXT_PUBLIC_DEFAULT_TIMEZONE:-Europe/Moscow}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
