components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryTypeQuery:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/CategoryType"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DateFromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date
    DateTimeFromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    DateTimeToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LiabilityId:
      name: liabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LiabilityPaymentId:
      name: liabilityPaymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParentIdQuery:
      name: parentId
      in: query
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 50
    RecurringTransactionId:
      name: recurringTransactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActiveQuery:
      name: isActive
      in: query
      schema:
        type: boolean

  responses:
    Unauthorized:
      description: Authentication failed or token is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current resource state or uniqueness constraints
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    AiAudioFormat:
      type: string
      enum: [wav, mp3, opus, webm, m4a, flac, pcm16]
    AiAudioPayload:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          examples: [audio/mpeg, audio/wav, audio/webm]
        format:
          oneOf:
            - $ref: "#/components/schemas/AiAudioFormat"
            - type: "null"
        base64:
          type: [string, "null"]
          contentEncoding: base64
          description: Inline audio bytes. Present when the client requested inline audio.
        url:
          type: [string, "null"]
          format: uri
          description: Temporary URL for downloading generated audio.
        durationMs:
          type: [integer, "null"]
          minimum: 0
    AiChatConversation:
      type: object
      required: [id, userId, title, createdAt, updatedAt, messages]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessage"
    AiChatConversationCreate:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
    AiChatConversationPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiChatConversationSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
    AiChatConversationSummary:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        lastMessagePreview:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiChatMessage:
      type: object
      required: [id, role, createdAt, content]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        createdAt:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessagePart"
        metadata:
          type: object
          additionalProperties: true
    AiChatMessagePart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, audio]
        text:
          type: [string, "null"]
        audio:
          oneOf:
            - $ref: "#/components/schemas/AiAudioPayload"
            - type: "null"
    AiChatRequest:
      type: object
      required: [input]
      properties:
        conversationId:
          type: [string, "null"]
          format: uuid
          description: Existing conversation to continue. Omit to start a new conversation.
        title:
          type: [string, "null"]
          maxLength: 200
          description: Optional title when starting a new conversation.
        input:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AiChatUserInputPart"
        responseModalities:
          type: array
          minItems: 1
          uniqueItems: true
          default: [text]
          items:
            $ref: "#/components/schemas/AiResponseModality"
        audioResponse:
          $ref: "#/components/schemas/AiAudioResponseOptions"
        context:
          $ref: "#/components/schemas/AiFinancialContextOptions"
        agentic:
          type: boolean
          default: true
          description: When true, the assistant uses planner → tools → finalizer flow to investigate user data and external sources before answering.
    AiChatResponse:
      type: object
      required: [conversationId, userMessageId, assistantMessageId, output]
      properties:
        conversationId:
          type: string
          format: uuid
        userMessageId:
          type: string
          format: uuid
        assistantMessageId:
          type: string
          format: uuid
        requestText:
          type: [string, "null"]
          description: STT-decoded text of the user's audio input. Present when audio was sent in the request. The frontend should use this text as the user message content instead of a placeholder like "голосовое сообщение".
        output:
          type: object
          required: [text]
          properties:
            text:
              type: [string, "null"]
              description: Assistant answer text. Present when text output is requested or when audio is transcribed.
            audio:
              oneOf:
                - $ref: "#/components/schemas/AiAudioPayload"
                - type: "null"
        toolResults:
          type: array
          description: Optional structured outputs from financial data lookups used by the assistant.
          items:
            $ref: "#/components/schemas/AiToolResult"
        usage:
          $ref: "#/components/schemas/AiUsage"
    AiChatUserInputPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, audio]
        text:
          type: [string, "null"]
          minLength: 1
          description: Required when type is `text`.
        audio:
          oneOf:
            - $ref: "#/components/schemas/AiAudioPayload"
            - type: "null"
          description: Required when type is `audio`; use base64 for this JSON endpoint.
    AiAudioResponseOptions:
      type: object
      properties:
        voice:
          type: [string, "null"]
          examples: [alloy, sage, ash, coral, echo]
        format:
          $ref: "#/components/schemas/AiAudioFormat"
        delivery:
          type: string
          enum: [inline_base64, temporary_url]
          default: temporary_url
    AiFinancialContextOptions:
      type: object
      properties:
        preferredDateFrom:
          type: [string, "null"]
          format: date
          description: Preferred start date for data queries. The AI may override.
        preferredDateTo:
          type: [string, "null"]
          format: date
          description: Preferred end date for data queries. The AI may override.
        baseCurrency:
          type: [string, "null"]
          minLength: 3
          maxLength: 3
          description: Preferred display currency (e.g. RUB, USD).
    AiResponseModality:
      type: string
      enum: [text, audio]
    AiToolResult:
      type: object
      required: [name, result]
      properties:
        name:
          type: string
          enum: [user_data, rag, search]
          description: Which tool produced this result.
        result:
          type: object
          additionalProperties: true
          description: Tool-specific result payload.
    AiUsage:
      type: object
      properties:
        inputTokens:
