<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinDoctor LAN Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #172033;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 620px);
        padding: 32px;
        border: 1px solid #d7dce5;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 6vw, 52px);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.55;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #eef2f7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10131a;
          color: #eef3fb;
        }

        main {
          border-color: #303849;
          background: #171c26;
          box-shadow: none;
        }

        code {
          background: #252d3d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LAN test works</h1>
      <p>
        This page is being served from Damir's Mac. If you can see it from another device
        on the same Wi-Fi, the frontend is reachable over the local network.
      </p>
      <p style="margin-top: 18px">Served at <code id="url"></code></p>
    </main>
    <script>
      document.getElementById("url").textContent = window.location.href;
    </script>
  </body>
</html>
