services:
  mongodb:
    image: ${GRAYLOG_MONGO_IMAGE}
    container_name: findoctor-graylog-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  elasticsearch:
    image: ${GRAYLOG_ELASTICSEARCH_IMAGE}
    container_name: findoctor-graylog-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  graylog:
    image: ${GRAYLOG_IMAGE}
    container_name: findoctor-graylog
    restart: unless-stopped
    depends_on:
      - mongodb
      - elasticsearch
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:${GRAYLOG_HTTP_PORT}/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${GRAYLOG_HTTP_PORT}:9000"
      - "${GRAYLOG_GELF_UDP_PORT}:${GRAYLOG_GELF_UDP_PORT}/udp"
      - "${GRAYLOG_GELF_TCP_PORT}:${GRAYLOG_GELF_TCP_PORT}/tcp"
      - "${GRAYLOG_SYSLOG_TCP_PORT}:1514/tcp"
    volumes:
      - graylog-data:/usr/share/graylog/data

volumes:
  mongodb-data:
  elasticsearch-data:
  graylog-data:
