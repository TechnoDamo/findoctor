openapi: 3.1.0
info:
  title: FinDoctor Client API
  version: 0.1.0
  summary: Client-facing API for financial accounts, ledger transactions, assets, liabilities, goals, tags, and analytics.
  license:
    name: Proprietary
    url: https://findoctor.example/legal/api-license
  description: |
    FinDoctor exposes user-owned financial data as explicit CRUD resources and keeps reference/admin data separate.

    Transfers are modeled as business objects connected to two underlying ledger transactions:
    one debit transaction on the source account and one credit transaction on the destination account.
    Creating, updating, or deleting a transfer must happen transactionally with those ledger rows.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.findoctor.example
    description: Production placeholder
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration, login, token refresh, and session revocation.
  - name: Current User
    description: Current authenticated user profile and preferences.
  - name: Reference Data
    description: Shared catalogs such as types, categories, and merchants.
  - name: Financial Institutions
    description: Banks, brokers, exchanges, lenders, and wallet providers.
  - name: Accounts
    description: User-owned financial accounts and balances.
  - name: Transactions
    description: Real ledger entries for income, expenses, and transfer legs.
  - name: Transfers
    description: Business transfers connected to underlying ledger transactions.
  - name: Recurring Transactions
    description: Expected repeating income, expense, transfer, and liability-payment patterns.
  - name: Assets
    description: User-owned assets used in net-worth calculations.
  - name: Liabilities
    description: User debts, loans, credit obligations, and their current state.
  - name: Liability Payments
    description: Actual debt payments linked to transaction rows.
  - name: Goals
    description: User financial goals and progress tracking.
  - name: Tags
    description: User-defined transaction labels.
  - name: Analytics
    description: Read models, snapshots, dashboard summaries, and derived series.
  - name: AI Chat
    description: Text and voice conversational AI with optional audio responses.
  - name: Imports
    description: Idempotent data ingestion workflows.

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      operationId: logoutUser
      responses:
        "204":
          description: Session revoked

  /ai/chat/messages:
    post:
      tags: [AI Chat]
      summary: Send a text or encoded-audio AI chat message
      description: |
        Sends a user message to the financial assistant. The message may contain text,
        audio encoded as base64, or both. The response can include text, audio, or both.
      operationId: createAiChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: AI assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ai/chat/audio:
    post:
      tags: [AI Chat]
      summary: Send an audio AI chat message
      description: Uploads an audio file directly and receives text, audio, or text plus audio.
      operationId: createAiVoiceChatMessage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AiVoiceChatMultipartRequest"
      responses:
        "200":
          description: AI assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ai/chat/conversations:
    get:
      tags: [AI Chat]
      summary: List AI chat conversations
      operationId: listAiChatConversations
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Conversation summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatConversationPage"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [AI Chat]
      summary: Create AI chat conversation
      operationId: createAiChatConversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatConversationCreate"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatConversation"

  /ai/chat/conversations/{conversationId}:
    get:
      tags: [AI Chat]
      summary: Get AI chat conversation
      operationId: getAiChatConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatConversation"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AI Chat]
      summary: Delete AI chat conversation
      operationId: deleteAiChatConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Conversation deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /me:
    get:
      tags: [Current User]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [Current User]
      summary: Update current user profile
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"

  /reference/account-types:
    get:
      tags: [Reference Data]
      summary: List account types
      operationId: listAccountTypes
      responses:
        "200":
          description: Account type catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTypeList"

  /reference/asset-types:
    get:
      tags: [Reference Data]
      summary: List asset types
      operationId: listAssetTypes
      responses:
        "200":
          description: Asset type catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetTypeList"

  /reference/liability-types:
    get:
      tags: [Reference Data]
      summary: List liability types
      operationId: listLiabilityTypes
      responses:
        "200":
          description: Liability type catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilityTypeList"

  /reference/provider-types:
    get:
      tags: [Reference Data]
      summary: List financial provider roles
      operationId: listProviderTypes
      responses:
        "200":
          description: Provider type catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTypeList"

  /reference/categories:
    get:
      tags: [Reference Data]
      summary: List transaction categories
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/CategoryTypeQuery"
        - $ref: "#/components/parameters/ParentIdQuery"
      responses:
        "200":
          description: Category tree or filtered category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
    post:
      tags: [Reference Data]
      summary: Create transaction category
      description: Categories are global in the current schema. If per-user categories are needed, add `user_id` before exposing this broadly.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "422":
          $ref: "#/components/responses/ValidationError"

  /reference/categories/{categoryId}:
    get:
      tags: [Reference Data]
      summary: Get transaction category
      operationId: getCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Reference Data]
      summary: Update transaction category
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reference Data]
      summary: Delete transaction category
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category deleted
        "409":
          $ref: "#/components/responses/Conflict"

  /merchants:
    get:
      tags: [Reference Data]
      summary: Search merchants
      operationId: listMerchants
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - name: riskLevel
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
      responses:
        "200":
          description: Matching merchants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantList"
    post:
      tags: [Reference Data]
      summary: Create or suggest merchant
      operationId: createMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantCreate"
      responses:
        "201":
          description: Created merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "422":
          $ref: "#/components/responses/ValidationError"

  /merchants/{merchantId}:
    get:
      tags: [Reference Data]
      summary: Get merchant
      operationId: getMerchant
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      responses:
        "200":
          description: Merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Reference Data]
      summary: Update merchant
      operationId: updateMerchant
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantUpdate"
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
    delete:
      tags: [Reference Data]
      summary: Delete merchant
      operationId: deleteMerchant
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      responses:
        "204":
          description: Merchant deleted

  /financial-institutions:
    get:
      tags: [Financial Institutions]
      summary: Search financial institutions
      operationId: listFinancialInstitutions
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
        - name: providerTypeCode
          in: query
          schema:
            type: string
          description: Filter institutions by provider role code.
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Matching institutions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitutionList"
    post:
      tags: [Financial Institutions]
      summary: Suggest or create a financial institution
      description: Client-facing creation can be moderated server-side; admin implementations may publish directly.
      operationId: createFinancialInstitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialInstitutionCreate"
      responses:
        "201":
          description: Created institution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitution"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /financial-institutions/{institutionId}:
    get:
      tags: [Financial Institutions]
      summary: Get financial institution
      operationId: getFinancialInstitution
      parameters:
        - $ref: "#/components/parameters/InstitutionId"
      responses:
        "200":
          description: Institution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitution"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Financial Institutions]
      summary: Update financial institution metadata
      operationId: updateFinancialInstitution
      parameters:
        - $ref: "#/components/parameters/InstitutionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialInstitutionUpdate"
      responses:
        "200":
          description: Updated institution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitution"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      parameters:
        - $ref: "#/components/parameters/ActiveQuery"
        - name: accountTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: institutionId
          in: query
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
    post:
      tags: [Accounts]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "422":
          $ref: "#/components/responses/ValidationError"

  /accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Accounts]
      summary: Update account
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Accounts]
      summary: Archive account
      description: Accounts with ledger history should generally be archived by setting `isActive=false`.
      operationId: deleteAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Account archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      operationId: listTransactions
      parameters:
        - $ref: "#/components/parameters/DateTimeFromQuery"
        - $ref: "#/components/parameters/DateTimeToQuery"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: merchantId
          in: query
          schema:
            type: string
            format: uuid
        - name: recurringTransactionId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
    post:
      tags: [Transactions]
      summary: Create transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /transactions/import:
    post:
      tags: [Imports, Transactions]
      summary: Import transactions idempotently
      operationId: importTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionImportResult"
        "422":
          $ref: "#/components/responses/ValidationError"

  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction
      operationId: getTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Transactions]
      summary: Update transaction
      operationId: updateTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Transactions]
      summary: Delete transaction
      operationId: deleteTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "204":
          description: Transaction deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transactions/{transactionId}/tags:
    get:
      tags: [Transactions, Tags]
      summary: List transaction tags
      operationId: listTransactionTags
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Transaction tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
    put:
      tags: [Transactions, Tags]
      summary: Replace all tags on a transaction
      operationId: replaceTransactionTags
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  uniqueItems: true
      responses:
        "200":
          description: Updated transaction tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /transactions/{transactionId}/tags/{tagId}:
    post:
      tags: [Transactions, Tags]
      summary: Attach tag to transaction
      operationId: addTransactionTag
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: Tag attached
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Transactions, Tags]
      summary: Detach tag from transaction
      operationId: removeTransactionTag
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: Tag detached
        "404":
          $ref: "#/components/responses/NotFound"

  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers
      operationId: listTransfers
      parameters:
        - $ref: "#/components/parameters/DateTimeFromQuery"
        - $ref: "#/components/parameters/DateTimeToQuery"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
          description: Match either source or destination account.
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paginated transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPage"
    post:
      tags: [Transfers]
      summary: Create transfer and underlying transactions
      description: |
        Creates one transfer row and two linked transaction rows in a single database transaction.
        The source transaction is an expense-like transfer debit; the destination transaction is an income-like transfer credit.
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "201":
          description: Created transfer with ledger transaction links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "422":
          $ref: "#/components/responses/ValidationError"

  /transfers/{transferId}:
    get:
      tags: [Transfers]
      summary: Get transfer
      operationId: getTransfer
      parameters:
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Transfers]
      summary: Update transfer and underlying transactions
      description: Updates the transfer row and synchronized amount, currency, datetime, account, and description fields on linked ledger transactions.
      operationId: updateTransfer
      parameters:
        - $ref: "#/components/parameters/TransferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
